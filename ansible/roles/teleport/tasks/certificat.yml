---
- name: Verifier si un certificat auto signé existe déjà
  ansible.builtin.command: openssl x509 -noout -in /var/lib/teleport/fullchain.pem
  register: certificat_exist
  failed_when: false
  changed_when: false
  tags: certificat

- name: Ajouter un certificat auto signé
  ansible.builtin.shell: |
    openssl req -x509 -nodes -days 3650 -newkey rsa:4096 \
      -keyout /var/lib/teleport/privkey.pem \
      -out /var/lib/teleport/fullchain.pem \
      -subj "/CN=bastion.tom.lan" \
      -addext "subjectAltName=DNS:bastion.tom.lan,IP:172.16.50.2"
  when: certificat_exist.rc != 0
  tags: certificat